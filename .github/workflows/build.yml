name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Fresh Gradle Wrapper & Build APK
      run: |
        # پیدا کردن مسیر دقیق پروژه اندروید
        GRADLEW_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "پروژه پیدا نشد!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        
        # ساخت کامل و تازه فایل‌های Gradle Wrapper بدون نیاز به فایل‌های قبلی
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        
        # ساخت فایل APK
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBNIS-Rhythm-Player-APK
        path: "**/build/outputs/apk/debug/*.apk"
