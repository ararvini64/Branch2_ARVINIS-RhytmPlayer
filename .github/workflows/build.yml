name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Missing Gradle Wrapper
      run: |
        # پیدا کردن مسیر پروژه و ساخت مجدد Gradle Wrapper مفقود شده
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "فایل gradlew پیدا نشد!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        
        # نصب سیستم گریدل بر روی سرور جهت بازسازی Wrapper
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper
        chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBNIS-Rhythm-Player-APK
        path: "**/build/outputs/apk/debug/*.apk"
