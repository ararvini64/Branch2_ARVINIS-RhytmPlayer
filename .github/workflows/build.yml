name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Force Clean and Rebuild Gradle Wrapper
      run: |
        # پیدا کردن پوشه اصلی پروژه اندروید
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "پروژه اندروید پیدا نشد!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        cd "$PROJECT_DIR"
        
        # پاک‌سازی پوشه ناقص قبلی gradle
        rm -rf gradle/wrapper/
        
        # دانلود و جایگزینی مستقیم gradle-wrapper.jar
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        # ساخت مجدد فایل gradlew
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBNIS-Rhythm-Player-APK
        path: "**/build/outputs/apk/debug/*.apk"
